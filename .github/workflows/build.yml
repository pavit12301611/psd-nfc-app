name: Build PSD NFC APK

on:
  push:
    branches: [ arena/6554476a-psd-nfc-app ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android command-line tools
        run: |
          SDK="$ANDROID_HOME/cmdline-tools"
          mkdir -p "$SDK"
          cd "$SDK"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm -f commandlinetools-linux-11076708_latest.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build debug APK (capture exit code)
        id: build
        run: |
          set +e
          gradle assembleDebug --no-daemon > /tmp/build.log 2>&1
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Post build error as commit comment
        if: steps.build.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXIT="${{ steps.build.outputs.exit }}"
          LOG=$(tail -120 /tmp/build.log)
          printf '%s' "$LOG" | jq -R -s --arg exit "$EXIT" \
            '{body: ("Gradle debug build failed (exit " + $exit + "). Tail of /tmp/build.log:\n\n\u0060\u0060\u0060\n" + . + "\n\u0060\u0060\u0060")}' \
            | gh api -X POST /repos/pavit12301611/psd-nfc-app/commits/${{ github.sha }}/comments --input - \
            || true

      - name: Upload APK artifact
        if: steps.build.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: psd-nfc-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
