name: Build PSD NFC APK

on:
  push:
    branches: [arena/e25bd87f-psd-nfc-app]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (API 34)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build release APK (signed with signing/release-keystore.p12)
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Push build log to branch for debugging (only on failure)
        if: failure()
        run: |
          cp /tmp/build.log ci-build-debug.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-build-debug.log
          git commit -m "ci-log: gradle build log [skip ci]" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || true

      - name: Inspect APK
        run: |
          ls -la app/build/outputs/apk/release/
          unzip -l app/build/outputs/apk/release/app-release.apk | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psd-nfc-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Commit APK into dist/ on this branch (so it is directly fetchable from GitHub)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f dist/app-release.apk
          git commit -m "ci: release APK build ${GITHUB_SHA:0:7} [skip ci]" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || true

      - name: Publish GitHub Release with APK asset (direct download link)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          APK=app/build/outputs/apk/release/app-release.apk
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --target "$GITHUB_SHA" --title "PSD NFC v1.0.0" \
            --notes "PSD NFC — fast & secure NFC link transmitter (Samsung Galaxy A53 5G & any NFC phone). Direct APK download: https://github.com/${{ github.repository }}/releases/download/v1.0.0/app-release.apk"
          ok=0
          for i in 1 2 3; do
            if gh release upload v1.0.0 "$APK" --clobber; then ok=1; break; fi
            echo "upload attempt $i failed"; sleep 5
          done
          [ "$ok" = "1" ] || echo "WARN: release asset upload failed"
          gh release view v1.0.0 --json assets --jq '.assets[].browser_download_url' || true
