name: Build PSD NFC APK

on:
  push:
    branches: [arena/e25bd87f-psd-nfc-app]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (API 34)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build release APK (signed with signing/release-keystore.p12)
        run: ./gradlew --no-daemon assembleRelease

      - name: Inspect APK
        run: |
          ls -la app/build/outputs/apk/release/
          unzip -l app/build/outputs/apk/release/app-release.apk | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psd-nfc-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --target "$GITHUB_SHA" --title "PSD NFC v1.0.0" \
              --notes "PSD NFC — fast & secure NFC link transmitter (works on Samsung Galaxy A53 5G and any NFC phone). Direct APK download: https://github.com/${{ github.repository }}/releases/download/v1.0.0/app-release.apk"
          fi
          gh release upload v1.0.0 "$APK" --clobber --name app-release.apk
          echo "DIRECT DOWNLOAD URL:"
          gh release view v1.0.0 --json assets --jq '.assets[].browser_download_url'
