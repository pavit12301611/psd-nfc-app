name: Build Aakash MIFARE Saharanpur ID APK

on:
  push:
    branches: [arena/87e17c3d-psd-nfc-app]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (API 34)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Run unit tests and build signed release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test assembleRelease 2>&1 | tee /tmp/build.log

      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "### Gradle errors" >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:|FAILURE:|What went wrong|Execution failed|^e: |Caused by:|symbol:|location:' /tmp/build.log \
              | head -40 | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
                echo "::error::$clean"
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              done
          fi

      - name: Upload build log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aakash-punch-build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Inspect APK
        run: |
          ls -la app/build/outputs/apk/release/
          unzip -l app/build/outputs/apk/release/app-release.apk | head -40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aakash-mifare-saharanpur-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v3.1.2-mifare-saharanpur
          APK=app/build/outputs/apk/release/app-release.apk
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Aakash Saharanpur ID v3.1.2 — remove guessed NDEF prefix leftover" \
            --notes "Single-purpose Aakash Saharanpur ID tool. Real card: MIFARE Classic 1K / Crypto1, SAK 08, ATQA 0400, 16 sectors / 1024 bytes, no NDEF. v3.1.2 removes the v3.1.1 registration-screen leftover 'EXPECTED NDEF BRANCH PREFIX = AAKASH': the field is hidden for MIFARE Classic, the guessed default is gone, old profiles are sanitised, student/roll is label-only, and the Type-2 writer no longer fabricates AAKASH / PSID / student text without exact NDEF bytes. Keeps the full 16-sector dump + key map, Gen2/CUID magic-card writer, and official Barcode/RFID/biometric research. For this card NFC punching was confirmed; printed barcode is not a credential, no camera scanner path, no guessed Delhi / CC-028 code, no fake attendance dialog. Stock Android HCE remains diagnostics only; MIFARE_VERIFY_OK is not an attendance punch. APK: https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk"
          gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].browser_download_url'
